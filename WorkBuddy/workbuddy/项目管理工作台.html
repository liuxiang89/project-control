<title>项目管理工作台</title>
<style>
  :root {
    --bg: #FFF7EE;            /* 奶油底 */
    --card: #FFFFFF;
    --line: #FFE8D6;          /* 暖色卡片边框 */

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }

  .app { display: flex; max-width: 1440px; margin: 0 auto; min-height: 100vh; }

  /* ============ 侧栏 ============ */
  .sidebar {
    width: 240px; flex: none; background: var(--bg);
    border-right: 1px solid var(--line-2); padding: 22px 16px;
    display: flex; flex-direction: column; gap: 20px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .logo { display: flex; align-items: center; gap: 9px; padding: 0 4px; }
  .logo-mark {
    width: 30px; height: 30px; border-radius: var(--radius); flex: none;
    background: linear-gradient(135deg, #FF6B9D, #FF8A3D); color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-name { font-weight: 600; font-size: 14px; }
  .logo-sub { font-size: 11px; color: var(--faint); }

  .nav-label { font-size: 11px; color: var(--faint); padding: 0 4px; margin-bottom: 6px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px;
    border-radius: var(--radius); cursor: pointer; font-size: 13.5px; color: var(--muted);
    transition: background .14s;
  }
  .nav-item .nicon { width: 18px; text-align: center; font-size: 13px; }
  .nav-item[data-view="kanban"] .nicon { color: #FF6B9D; }
  .nav-item[data-view="gantt"] .nicon { color: #6BCB77; }
  .nav-item[data-view="calendar"] .nicon { color: #4CC9F0; }
  .nav-item:hover { background: var(--hl); color: var(--text); }
  .nav-item.active { background: #FFE9F0; color: #FF6B9D; font-weight: 600; }

  .ip-list { display: flex; flex-direction: column; gap: 2px; }
  .ip-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border-radius: var(--radius); cursor: pointer; transition: background .14s;
  }
  .ip-item:hover { background: var(--hl); }
  .ip-item .bar { width: 4px; height: 24px; border-radius: 2px; flex: none; }
  .ip-item .info { flex: 1; min-width: 0; }
  .ip-item .nm { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ip-item .dt { font-size: 10.5px; color: var(--faint); }
  .badge { font-size: 10px; padding: 1px 7px; border-radius: var(--radius); color: #fff; flex: none; white-space: nowrap; }
  .ip-item .del {
    width: 16px; height: 16px; flex: none; border-radius: 4px; border: none; background: transparent;
    color: var(--faint); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; opacity: 0; transition: .14s;
  }
  .ip-item:hover .del { opacity: 1; }
  .ip-item .del:hover { color: var(--danger); background: var(--hl); }
  .toggle-btn {
    width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--line-2); background: #fff;
    cursor: pointer; font-size: 12px; color: var(--muted); line-height: 1;
  }
  .toggle-btn:hover { background: var(--hl); }
  .add-btn {
    width: 100%; margin-top: 6px; padding: 7px; border: 1px dashed var(--line-2); border-radius: var(--radius);
    background: transparent; color: var(--muted); font-size: 12.5px; cursor: pointer; transition: .14s;
  }
  .add-btn:hover { color: var(--accent); background: #FFF0F6; }

  .tools { border-top: 1px solid var(--line-2); padding-top: 14px; display: flex; gap: 8px; }
  .tools button {
    flex: 1; height: 32px; border: 1px solid var(--line-2); border-radius: var(--radius); background: #fff;
    cursor: pointer; font-size: 12px; color: var(--muted); transition: .14s;
  }
  .tools button:hover { background: #FFF0F6; color: var(--accent); }
  .autosave-note { font-size: 11px; color: var(--faint); text-align: center; margin-top: 2px; }

  /* ============ 主内容 ============ */
  .main { flex: 1; min-width: 0; padding: 24px 28px 48px; }
  .view { display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 20px;
  }
  .card h2 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .card h2 .tag { font-size: 11px; font-weight: 400; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  /* ============ 阶段看板 ============ */
  .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: start; }
  .kb-col { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; min-height: 120px; }
  .kb-col.dragover { border-color: var(--accent); background: #FFE9F0; }
  .kb-col h3 { font-size: 12.5px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
  .kb-col .cnt { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: auto; }
  .kb-card {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 11px; margin-bottom: 8px; cursor: pointer; transition: background .14s, box-shadow .14s, transform .14s;
  }
  .kb-card:hover { background: #FCFCFB; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .kb-card.dragging { opacity: .4; cursor: grabbing; }
  .kb-card .kc-top { display: flex; align-items: center; gap: 7px; }
  .kb-card .kc-cat { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .kb-card .kc-name { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kb-card .kc-deadline { font-size: 11px; color: var(--muted); margin-top: 7px; }
  .kb-card .kc-next { font-size: 11.5px; color: var(--text); margin-top: 3px; display: flex; gap: 5px; align-items: flex-start; }
  .kb-card .kc-next .pin { flex: none; }
  .kb-card .urgent { display: inline-block; font-size: 10px; font-weight: 600; color: #fff; background: var(--danger); border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
  .kb-card .st-tag { font-size: 9.5px; padding: 1px 6px; border-radius: 4px; color: #fff; flex: none; }
  .kb-card .kb-prog { margin-top: 9px; }
  .kb-card .kb-prog .pr-head { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-bottom: 3px; }
  .kb-card .kb-prog .pr-bar { height: 5px; border-radius: 3px; background: #FFEBDD; overflow: hidden; }
  .kb-card .kb-prog .pr-fill { height: 100%; border-radius: 3px; }
  .empty { font-size: 12px; color: var(--faint); text-align: center; padding: 14px 0; }

  /* ============ 甘特图 ============ */
  .gantt-wrap { overflow: hidden; cursor: grab; }
  .gantt-wrap.grabbing { cursor: grabbing; }
  .gantt { display: inline-block; min-width: 100%; }
  .g-head { display: flex; border-bottom: 1px solid var(--line-2); }
  .g-corner { width: 150px; flex: none; font-size: 12px; font-weight: 600; color: var(--muted); padding: 7px 8px 7px 0; background: var(--card); position: sticky; left: 0; z-index: 5; border-right: 1px solid var(--line-2); }
  .g-head-right { position: relative; flex: none; }
  .g-months-row { position: relative; height: 24px; }
  .g-months-row .mc { position: absolute; top: 4px; height: 16px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); background: var(--bg); border-radius: 4px; }
  .g-days-row { position: relative; height: 36px; border-bottom: 1px solid var(--line-2); }
  .g-days-row .dcell { position: absolute; top: 3px; text-align: center; }
  .g-days-row .dcell .dnum { font-size: 11px; font-weight: 600; color: var(--text); line-height: 1.2; }
  .g-days-row .dcell .dweek { font-size: 9px; color: var(--faint); line-height: 1.2; }
  .g-days-row .dcell.wknd .dnum, .g-days-row .dcell.wknd .dweek { color: #F2A6B8; }
  .g-days-row .dcell.today-d { background: var(--accent); border-radius: 4px; }
  .g-days-row .dcell.today-d .dnum, .g-days-row .dcell.today-d .dweek { color: #fff; }
  .g-body { position: relative; }
  .g-gridlines { position: absolute; top: 0; bottom: 0; left: 0; right: 0; pointer-events: none; z-index: 0; }
  .g-gridlines .wk { position: absolute; top: 0; bottom: 0; background: var(--cal-bg); }
  .g-gridlines .vl { position: absolute; top: 0; bottom: 0; border-left: 1px solid #FFEBDD; }
  .g-row { display: flex; height: 42px; position: relative; z-index: 1; }
  .g-name { width: 150px; flex: none; display: flex; flex-direction: column; justify-content: center; padding-right: 8px; background: var(--card); position: sticky; left: 0; z-index: 3; border-right: 1px solid var(--line-2); cursor: pointer; }
  .g-name .nm { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-name .st { font-size: 10px; margin-top: 1px; }
  .g-timeline { position: relative; flex: none; }
  .g-track { position: absolute; top: 50%; transform: translateY(-50%); height: 14px; border-radius: 4px; }
  .g-bar { position: absolute; top: 50%; transform: translateY(-50%); height: 14px; border-radius: 4px; }
  .g-ms { position: absolute; top: 50%; transform: translate(-50%,-50%); z-index: 4; cursor: default; }
  .dms { width: 9px; height: 9px; display: block; margin: 0 auto; transform: rotate(45deg); border-radius: 2px; }
  .dms.done { background: #6BCB77; border: 1.5px solid #6BCB77; }
  .dms.todo { background: #fff; border: 1.5px solid #6BCB77; }
  .g-ms .mlabel { position: absolute; left: 50%; transform: translateX(-50%); font-size: 9.5px; color: var(--muted); white-space: nowrap; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; line-height: 1.4; }
  .g-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; border-radius: 50%; z-index: 3; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .g-dot.dot-done { opacity: .55; }
  .g-dot.dot-log { width: 4px; height: 4px; }
  .g-today { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--danger); z-index: 2; pointer-events: none; }
  .g-today .tlabel { position: absolute; top: 0; left: 4px; font-size: 10px; color: var(--danger); font-weight: 600; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--muted); }
  .legend .li { display: flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 16px; height: 8px; border-radius: 3px; display: inline-block; }

  /* ============ 月历 ============ */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav { display: flex; align-items: center; gap: 8px; }
  .cal-nav button { border: 1px solid var(--line-2); background: #fff; border-radius: 4px; width: 30px; height: 30px; cursor: pointer; font-size: 14px; color: var(--text); }
  .cal-nav button:hover { background: var(--hl); }
  .cal-nav .mon { font-size: 15px; font-weight: 600; min-width: 120px; text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-grid .wd { text-align: center; font-size: 11.5px; color: var(--muted); padding: 4px 0 6px; font-weight: 500; }
  .cal-cell { min-height: 96px; border: 1px solid var(--line-2); border-radius: 10px; padding: 6px 7px; background: #fff; overflow: hidden; }
  .cal-cell.out { background: #FAF9F6; opacity: .6; }
  .cal-cell .dnum { font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
  .cal-cell.today { border: 1.5px solid #FF8A3D; box-shadow: 0 2px 8px rgba(255,138,61,.15); }
  .cal-cell.today .dnum { display: inline-flex; width: 21px; height: 21px; border-radius: 6px; background: #FF8A3D; color: #fff; align-items: center; justify-content: center; font-weight: 600; }
  .ev { display: flex; align-items: center; font-size: 10px; color: var(--text); border-radius: 5px; padding: 2px 5px 2px 6px; margin-top: 3px; white-space: nowrap; overflow: hidden; font-weight: 500; border-left: 3px solid transparent; cursor: pointer; }
  .ev:hover { filter: brightness(.96); }
  .ev .ev-t { overflow: hidden; text-overflow: ellipsis; }
  .ev span.ic { margin-right: 3px; flex: none; }
  .more { font-size: 10px; color: #FF8A3D; margin-top: 3px; cursor: pointer; font-weight: 500; }
  .more:hover { text-decoration: underline; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-2); }
  .cal-legend .lg { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); }
  .cal-legend .lg i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  /* 事件展开浮层 */
  .ev-pop-mask { position: fixed; inset: 0; background: rgba(60,55,50,.28); z-index: 90; display: flex; align-items: center; justify-content: center; }
  .ev-pop { background: #fff; border-radius: 14px; width: min(420px, 88vw); max-height: 70vh; overflow: auto; padding: 16px 18px; box-shadow: 0 12px 40px rgba(0,0,0,.14); }
  .ev-pop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .ev-pop-head .pd { font-size: 14.5px; font-weight: 600; color: var(--text); }
  .ev-pop-head button { border: none; background: var(--bg); width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 14px; color: var(--muted); }
  .ev-pop-item { display: flex; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--bg); margin-bottom: 6px; border-left: 3px solid transparent; cursor: pointer; transition: background .12s, transform .12s; }
  .ev-pop-item:hover { background: #F5F3EF; transform: translateX(2px); }
  .ev-pop-item .pi { flex: none; font-size: 13px; }
  .ev-pop-item .pt { font-size: 12.5px; color: var(--text); line-height: 1.5; word-break: break-word; }
  .ev-pop-item .pp { font-size: 10.5px; color: var(--faint); margin-top: 2px; }

  .dist-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .dist-row:last-child { margin-bottom: 0; }
  .dist-row .dn { width: 200px; flex: none; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dist-track { flex: 1; height: 12px; background: #F0EFEA; border-radius: 3px; overflow: hidden; }
  .dist-fill { height: 100%; border-radius: 3px; }
  .dist-days { flex: none; width: 44px; font-size: 11px; color: var(--muted); text-align: right; }

  /* ============ 详情 ============ */
  .detail-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .detail-top .detail-head { flex: 1; min-width: 0; }
  .back-btn { height: 30px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--line-2); background: #fff; cursor: pointer; font-size: 12.5px; color: var(--muted); flex: none; }
  .back-btn:hover { background: var(--hl); color: var(--text); }
  .detail-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }
  .detail-left, .detail-right { display: flex; flex-direction: column; gap: 10px; }
  .sec-title { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 4px; }
  .stage-switch { display: flex; flex-wrap: wrap; gap: 6px; }
  .stage-btn { border: 1px solid var(--line-2); background: #fff; border-radius: 4px; padding: 4px 11px; cursor: pointer; font-size: 12px; color: var(--muted); transition: .14s; }
  .stage-btn.on { color: #fff; border-color: transparent; }
  .tl { position: relative; padding-left: 18px; }
  .tl::before { content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px; background: var(--line-2); }
  .tl-item { position: relative; padding: 4px 0 8px; }
  .tl-item::before { content: ""; position: absolute; left: -18px; top: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line-2); }
  .tl-item .tl-top { display: flex; align-items: center; gap: 4px; }
  .tl-item .tl-date { font-size: 11px; color: var(--faint); }
  .tl-item .tl-type { display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 4px; background: var(--bg); color: var(--muted); margin-left: 4px; }
  .tl-item .tl-text { font-size: 12.5px; color: var(--text); margin-top: 2px; line-height: 1.5; word-break: break-word; }
  .tl-item .todo-check input { width: 14px; height: 14px; }
  .tl-item.done .tl-text { text-decoration: line-through; color: var(--faint); }
  .tl-item.done::before { background: #6BCB77; }
  .todo-item { display: flex; align-items: center; gap: 8px; padding: 6px 2px; border-bottom: 1px dashed var(--line-2); }
  .todo-item:last-child { border-bottom: none; }
  .todo-check { flex: none; display: flex; }
  .todo-check input { width: 15px; height: 15px; accent-color: #6BCB77; cursor: pointer; }
  .todo-line { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; }
  .todo-line .tt { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .todo-line .td { font-size: 11px; color: var(--faint); flex: none; }
  .todo-item.done .tt { text-decoration: line-through; color: var(--faint); }
  .ia-group { display: flex; gap: 2px; flex: none; opacity: 0; transition: opacity .15s; }
  .todo-item:hover .ia-group, .tl-item:hover .ia-group { opacity: 1; }
  .ia { width: 20px; height: 20px; border: none; background: transparent; border-radius: 4px; cursor: pointer; font-size: 12px; color: var(--faint); line-height: 1; padding: 0; }
  .ia:hover { background: var(--hl); color: var(--accent); }
  .ia.del:hover { background: #FFE9E6; color: var(--danger); }
  .mini-btn { height: 24px; padding: 0 9px; border: 1px solid var(--line-2); background: #fff; border-radius: 4px; cursor: pointer; font-size: 11px; color: var(--muted); }
  .mini-btn.ok { background: var(--accent); color: #fff; border: none; }
  .mini-btn:hover { background: var(--hl); color: var(--text); }
  .todo-item.editing, .tl-item.editing { gap: 6px; flex-wrap: wrap; }
  .ei-date { width: 118px; flex: none; }
  .ei-text { flex: 1; min-width: 120px; }
  .ei-date, .ei-text { border: 1px solid var(--line-2); border-radius: 4px; padding: 4px 7px; font-size: 12.5px; color: var(--text); background: #fff; font-family: inherit; }
  .ei-date:focus, .ei-text:focus { outline: none; border-color: var(--accent); }
  .quick-add { display: flex; gap: 6px; margin-top: 8px; }
  .quick-add input { border: 1px solid var(--line-2); border-radius: 4px; padding: 6px 9px; font-size: 12.5px; color: var(--text); background: #fff; font-family: inherit; }
  .quick-add input[type="date"] { width: 122px; flex: none; }
  .quick-add input[type="text"] { flex: 1; min-width: 0; }
  .quick-add input:focus { outline: none; border-color: var(--accent); }
  .quick-add button { flex: none; width: 34px; border: 1px solid var(--line-2); border-radius: 4px; background: #fff; cursor: pointer; font-size: 14px; color: var(--muted); }
  .quick-add button:hover { background: var(--hl); color: var(--text); }
  .detail-sub { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
  .detail-prog { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .detail-prog .dp-bar { flex: 1; height: 8px; background: #F0EFEA; border-radius: 4px; overflow: hidden; }
  .detail-prog .dp-fill { height: 100%; border-radius: 4px; transition: width .25s ease; }
  .detail-prog .dp-num { font-size: 11.5px; font-weight: 600; color: var(--text); min-width: 58px; text-align: right; }
  .urgent { display: inline-block; font-size: 10px; font-weight: 600; color: #fff; background: var(--danger); border-radius: 4px; padding: 1px 7px; vertical-align: 3px; }
  .detail-right textarea.notes { min-height: 72px; resize: vertical; width: 100%; border: 1px solid var(--line-2); border-radius: 4px; padding: 8px 10px; font-size: 13px; color: var(--text); background: #fff; font-family: inherit; }
  .detail-right textarea.notes:focus { outline: none; border-color: var(--accent); }

/* 存储检测：localStorage 不可用（如部分 file:// 环境）时降级为内存存储 */
const _memStore = {};
const storageOK = (() => {
  try { const k = '__pm_t__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
  catch (e) { return false; }
})();
function storageGet(key) {
  if (storageOK) { try { return localStorage.getItem(key); } catch (e) { return _memStore[key] || null; } }
  return _memStore[key] || null;
}
function storageSet(key, val) {
  if (storageOK) { try { localStorage.setItem(key, val); return; } catch (e) {} }
  _memStore[key] = val;
}

function loadProjects() {
  try {
    const raw = storageGet(STORAGE_KEY);

    if (isDemoData(arr)) return null;   // 旧演示数据 → 用内置真实快照替换
    return arr;
  } catch (e) {}
  return null;
}

// 补齐字段 + 兼容旧数据（nodes → logs/todos）
function normalizeProjects() {
  const MIGRATE = { ideation: 'design', active: 'production', paused: 'design', ended: 'completed' };
  PROJECTS.forEach(p => {
    if (Array.isArray(p.nodes) && p.nodes.length) {
      p.logs = (p.logs || []).concat(p.nodes.map(n => ({ id: n.id, date: n.date, type: '', text: [n.progress, n.idea, n.issue].filter(Boolean).join('；') || n.title })));
      p.todos = (p.todos || []).concat(p.nodes.map(n => ({ id: n.id + 5000, date: n.date, title: n.title, done: !!n.done })));
    }
    delete p.nodes;
    p.logs = p.logs || [];
    p.todos = p.todos || [];
    // 时间线节点同样可打钩：补齐 done 字段
    p.logs.forEach(l => { if (typeof l.done !== 'boolean') l.done = !!l.done; });
    if (!p.color) { const c = PALETTE[(p.id - 1) % PALETTE.length]; p.color = c.color; }
    if (!p.emoji) { const c = PALETTE[(p.id - 1) % PALETTE.length]; p.emoji = c.emoji; }
    // 旧状态 → 新 4 态迁移（否则 statusMap 找不到会崩溃）
    if (MIGRATE[p.status]) p.status = MIGRATE[p.status];
    if (!statusMap[p.status]) p.status = 'design';
  });
  // 进度由完成事项勾选比例重算
  PROJECTS.forEach(p => recalcProgress(p));
}

function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function fmtDate(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

// 可打钩的节点 = 完成事项 + 项目时间线事件；勾选比例即项目进度
function checkItems(p) { return [...(p.todos || []), ...(p.logs || [])]; }
function doneStat(p) {
  const items = checkItems(p);
  return { done: items.filter(x => x.done).length, total: items.length };
}
// 进度由打钩比例自动计算；全部打钩 → 项目标记完成
function recalcProgress(p) {
  const { done, total } = doneStat(p);
  if (!total) return;
  p.progress = Math.round(done / total * 100);
  if (done === total) p.status = 'completed';
}

// 下一步动作自动推导：未完成事项 > 未完成时间线节点 > 未完成里程碑 > 手动填的下一步
function nextStep(p) {
  if (p.status === 'completed') return '已完成 ✓';
  const todo = (p.todos || []).filter(t => !t.done).sort((a, b) => a.date.localeCompare(b.date))[0];
  if (todo) return `${todo.title} · ${todo.date}`;
  const log = (p.logs || []).filter(l => !l.done).sort((a, b) => a.date.localeCompare(b.date))[0];
  if (log) return `${log.text.length > 18 ? log.text.slice(0, 18) + '…' : log.text} · ${log.date}`;
  const ms = (p.milestones || []).filter(m => m.date > TODAY).sort((a, b) => a.date.localeCompare(b.date))[0];
  if (ms) return `${ms.name} · ${ms.date}`;
  return p.nextAction || '暂无下一步';
}
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function hexToRgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
const pName = p => `${p.emoji} ${p.name}`;

function renderGantt() {
  const NAME_W = 150, PX = 30;
  const WEEK = ['日','一','二','三','四','五','六'];
  const allDates = [];
  PROJECTS.forEach(p => { allDates.push(parseDate(p.start), parseDate(p.end)); p.milestones.forEach(m => allDates.push(parseDate(m.date))); });
  allDates.push(parseDate(TODAY));
  const min = new Date(Math.min(...allDates.map(d => d.getTime()))); min.setDate(1);
  const max = new Date(Math.max(...allDates.map(d => d.getTime()))); max.setMonth(max.getMonth()+1, 0);
  const totalDays = daysBetween(min, max) + 1;
  const TW = totalDays * PX;
  const x = d => daysBetween(min, d) * PX;

  let monthsHtml = '', daysHtml = '', gridHtml = '';
  const cur = new Date(min.getFullYear(), min.getMonth(), 1);
  while (cur <= max) {
    const dim = new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate();
    monthsHtml += `<span class="mc" style="left:${x(cur)}px;width:${dim*PX-2}px">${cur.getFullYear()}-${pad2(cur.getMonth()+1)}</span>`;
    if (x(cur) > 0) gridHtml += `<span class="vl" style="left:${NAME_W + x(cur)}px"></span>`;
    cur.setMonth(cur.getMonth() + 1);
  }
  const d = new Date(min);
  for (let i = 0; i < totalDays; i++) {
    const dow = d.getDay(), isToday = fmtDate(d) === TODAY, wknd = dow === 0 || dow === 6;
    daysHtml += `<div class="dcell ${wknd?'wknd':''} ${isToday?'today-d':''}" style="left:${i*PX}px;width:${PX}px"><div class="dnum">${d.getDate()}</div><div class="dweek">周${WEEK[dow]}</div></div>`;
    if (wknd) gridHtml += `<span class="wk" style="left:${NAME_W + i*PX}px;width:${PX}px"></span>`;
    d.setDate(d.getDate() + 1);
  }

  const rows = PROJECTS.map(p => {
    const s = parseDate(p.start), e = parseDate(p.end), t = parseDate(TODAY);
    const sx = x(s), ex = x(e) + PX;
    const pxEnd = sx + (ex - sx) * (p.progress / 100);   // 已推进宽度按进度百分比
    const track = `<div class="g-track" data-pid="${p.id}" style="left:${sx}px;width:${ex-sx}px;background:${hexToRgba(p.color,.18)}"></div>`;
    const bar = p.progress > 0 ? `<div class="g-bar" data-pid="${p.id}" style="left:${sx}px;width:${Math.max(pxEnd-sx,2)}px;background:${p.color}"></div>` : '';
    const ms = p.milestones.map((m, i) => {
      const done = m.date <= TODAY;
      const topOffset = i % 2 === 0 ? -22 : -34;
      return `<div class="g-ms" style="left:${x(parseDate(m.date)) + PX/2}px" title="${m.name} · ${m.date}">
        <span class="mlabel" style="top:${topOffset}px">${m.name}</span><span class="dms ${done?'done':'todo'}"></span></div>`;
    }).join('');
    // 时间线事件点：完成事项 + 时间线记录
    const evMarks = [];
    (p.todos || []).forEach(td => evMarks.push({ date: td.date, kind: td.done ? 'dot-done' : 'dot-todo', label: td.title }));
    (p.logs || []).forEach(lg => evMarks.push({ date: lg.date, kind: lg.done ? 'dot-log dot-done' : 'dot-log', label: (lg.done ? '✓ ' : '') + lg.text.slice(0, 14) }));
    const evHtml = evMarks.map(ev => {
      const color = ev.kind === 'dot-log' ? '#c9c4bb' : p.color;
      return `<span class="g-dot ${ev.kind}" style="left:${x(parseDate(ev.date)) + PX/2}px;background:${color}" title="${ev.label} · ${ev.date}"></span>`;
    }).join('');
    return `<div class="g-row">
      <div class="g-name" data-pid="${p.id}" title="点击查看详情">
        <div class="nm">${pName(p)}</div><div class="st" style="color:${statusMap[p.status].color}">${statusMap[p.status].label}</div>
      </div>
      <div class="g-timeline" style="width:${TW}px">${track}${bar}${ms}${evHtml}</div>
    </div>`;
  }).join('');

  document.getElementById('gantt').innerHTML = `
    <div class="g-head"><div class="g-corner">项目 / 状态</div><div class="g-head-right" style="width:${TW}px"><div class="g-months-row">${monthsHtml}</div><div class="g-days-row">${daysHtml}</div></div></div>
    <div class="g-body"><div class="g-gridlines">${gridHtml}</div><div class="g-today" style="left:${NAME_W + x(parseDate(TODAY)) + PX/2}px"><span class="tlabel">今日</span></div>${rows}</div>`;
}
(function () {
  const wrap = document.getElementById('ganttWrap');
  let down = false, sx = 0, sl = 0;
  wrap.addEventListener('mousedown', e => { down = true; sx = e.clientX; sl = wrap.scrollLeft; wrap.classList.add('grabbing'); });
  window.addEventListener('mousemove', e => { if (!down) return; wrap.scrollLeft = sl - (e.clientX - sx); });
  window.addEventListener('mouseup', () => { down = false; wrap.classList.remove('grabbing'); });

      <input type="text" class="ei-text" id="ed-td-title" value="${escapeHtml(t.title)}">
      <button class="mini-btn ok" data-edsave="todo" data-id="${t.id}" type="button">保存</button>
      <button class="mini-btn" data-edcancel type="button">取消</button>
    </div>`;
  }
  return `<div class="todo-item ${t.done?'done':''}">
    <label class="todo-check"><input type="checkbox" data-tid="${t.id}" ${t.done?'checked':''}></label>
    <div class="todo-line"><span class="tt">${t.title}</span><span class="td">${t.date}</span></div>
    <div class="ia-group">
      <button class="ia" data-edit="todo" data-id="${t.id}" type="button" title="编辑">✎</button>
      <button class="ia del" data-del="todo" data-id="${t.id}" type="button" title="删除">×</button>
    </div>
  </div>`;
}

function logItemHtml(l) {
  if (editingLog === l.id) {
    return `<div class="tl-item editing">
      <input type="date" class="ei-date" id="ed-lg-date" value="${l.date}">
      <input type="text" class="ei-text" id="ed-lg-text" value="${escapeHtml(l.text)}">
      <button class="mini-btn ok" data-edsave="log" data-id="${l.id}" type="button">保存</button>
      <button class="mini-btn" data-edcancel type="button">取消</button>
    </div>`;
  }
  return `<div class="tl-item ${l.done ? 'done' : ''}">
    <div class="tl-top"><label class="todo-check"><input type="checkbox" data-lid="${l.id}" ${l.done?'checked':''}></label><span class="tl-date">${l.date}</span>${l.type?`<span class="tl-type">${l.type}</span>`:''}
      <span class="ia-group"><button class="ia" data-edit="log" data-id="${l.id}" type="button" title="编辑">✎</button><button class="ia del" data-del="log" data-id="${l.id}" type="button" title="删除">×</button></span>
    </div>
    <div class="tl-text">${l.text}</div>
  </div>`;
}

function renderProjectDetail() {
  const p = getProject(currentDetailId); if (!p) return;
  document.getElementById('detailName').textContent = pName(p);
  document.getElementById('detailName').style.color = p.color;
  document.getElementById('detailSub').textContent = `开始于 ${p.start} · 预计完成 ${p.end} · 进度 ${p.progress}%`;
  const ds = doneStat(p);
  document.getElementById('detailProg').innerHTML = `
    <div class="dp-bar"><div class="dp-fill" style="width:${p.progress}%;background:${p.color}"></div></div>
    <span class="dp-num">✓ ${ds.done}/${ds.total}</span>`;
  const dl = daysBetween(parseDate(TODAY), parseDate(p.end));
  document.getElementById('detailUrgent').innerHTML = (!isCompleted(p) && dl < 3) ? `<span class="urgent">‼️ ${dl < 0 ? '已逾期' : '还剩' + dl + '天'}</span>` : '';
  document.getElementById('detailStages').innerHTML = STATUSES.map(st =>
    `<button class="stage-btn ${p.status===st.key?'on':''}" data-status="${st.key}" style="${p.status===st.key?`background:${st.color};border-color:${st.color}`:''}">${st.label}</button>`).join('');
  const logs = (p.logs||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('logList').innerHTML = logs.map(logItemHtml).join('') || '<div class="empty">还没有记录，在下方添加第一条</div>';
  const todos = (p.todos||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('todoList').innerHTML = todos.map(todoItemHtml).join('') || '<div class="empty">暂无事项，在下方添加</div>';
  document.getElementById('detailNotes').value = p.notes || '';
  document.getElementById('detailPlans').value = p.plans || '';
}
function openProjectDetail(id) {
  currentDetailId = id;
  document.getElementById('log-date').value = TODAY;
  document.getElementById('td-date').value = TODAY;
  renderProjectDetail(); switchView('project');
}
function closeProjectDetail() { switchView(currentView); currentDetailId = null; }

/* ============================================================
   ▍视图切换与渲染
   ============================================================ */
let currentView = 'kanban';
function switchView(view) {
  if (view !== 'project') currentView = view;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  document.getElementById('view-kanban').style.display   = view==='kanban'  ? '' : 'none';
  document.getElementById('view-gantt').style.display   = view==='gantt'   ? '' : 'none';
  document.getElementById('view-calendar').style.display = view==='calendar'? '' : 'none';
  document.getElementById('view-project').style.display  = view==='project' ? '' : 'none';
}
function renderAll() { renderSidebar(); renderKanban(); renderGantt(); renderCalendar(); renderDistribution(); }

/* ============================================================
   ▍初始化
   ============================================================ */
initCal();
renderAll();
document.querySelectorAll('.nav-item').forEach(el => el.addEventListener('click', () => switchView(el.dataset.view)));

// 保存能力提示
(function () {
  const note = document.getElementById('autosaveNote');
  if (note) note.textContent = storageOK
    ? '⚡ 自动保存已开启 · 关闭或刷新后数据不丢'
    : '⚠️ 当前环境无法持久化保存（数据仅本次会话有效）';
})();

function setupToggle(btnId, listId) {
  const btn = document.getElementById(btnId), list = document.getElementById(listId);
  btn.addEventListener('click', () => { const open = list.style.display !== 'none'; list.style.display = open ? 'none' : ''; btn.textContent = open ? '＋' : '－'; });
}
setupToggle('ipToggle', 'inProgress');
setupToggle('doneToggle', 'completed');

['inProgress', 'completed'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    const del = e.target.closest('.del');
    if (del) { removeProject(Number(del.dataset.id)); return; }
    const item = e.target.closest('.ip-item');
    if (item) openProjectDetail(Number(item.dataset.id));
  });
});
document.getElementById('gantt').addEventListener('click', e => {
  const t = e.target.closest('[data-pid]');
  if (t) openProjectDetail(Number(t.dataset.pid));
});

document.getElementById('exportBtn').addEventListener('click', exportData);
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ''; });

(function () {
  const mask = document.getElementById('modal');
  document.getElementById('np-color').innerHTML = PALETTE.map(c => `<option value="${c.key}">${c.label} ${c.emoji}</option>`).join('');
  document.getElementById('np-stage').innerHTML = STATUSES.map(s => `<option value="${s.key}">${s.label}</option>`).join('');

  document.getElementById('addProjBtn').addEventListener('click', () => {
    document.getElementById('np-start').value = TODAY;
    const e = new Date(parseDate(TODAY)); e.setDate(e.getDate() + 30);
    document.getElementById('np-end').value = fmtDate(e);
    document.getElementById('np-stage').value = 'design';
    mask.style.display = 'flex'; document.getElementById('np-name').focus();
  });
  document.getElementById('np-cancel').addEventListener('click', () => mask.style.display = 'none');
  mask.addEventListener('click', e => { if (e.target === mask) mask.style.display = 'none'; });
  document.getElementById('np-save').addEventListener('click', () => {
    const name = document.getElementById('np-name').value.trim();
    const start = document.getElementById('np-start').value;
    const end = document.getElementById('np-end').value;
    if (!name) { alert('请输入项目名称'); return; }
    if (!start || !end) { alert('请填写起止日期'); return; }
    const c = PALETTE.find(x => x.key === document.getElementById('np-color').value) || PALETTE[0];
    PROJECTS.push({ id: nextId++, name, emoji: c.emoji, color: c.color,
      status: document.getElementById('np-stage').value,
      nextAction: document.getElementById('np-next').value.trim(), progress: 0,
      start, end, milestones: [], logs: [], todos: [], notes: '', plans: '' });
    mask.style.display = 'none'; document.getElementById('np-name').value = ''; document.getElementById('np-next').value = '';
    saveProjects(); renderAll();
    document.getElementById('inProgress').style.display = ''; document.getElementById('ipToggle').textContent = '－';
  });
})();

document.getElementById('detailBack').addEventListener('click', closeProjectDetail);
document.getElementById('detailStages').addEventListener('click', e => {
  const btn = e.target.closest('.stage-btn'); if (!btn) return;
  const p = getProject(currentDetailId); if (!p) return;
  p.status = btn.dataset.status; saveProjects(); renderAll(); renderProjectDetail();
});
document.getElementById('log-add').addEventListener('click', () => {
  const p = getProject(currentDetailId); if (!p) return;
  const text = document.getElementById('log-text').value.trim();
  const date = document.getElementById('log-date').value;
  if (!text) { alert('请输入记录内容'); return; }
  if (!date) { alert('请选择日期'); return; }
  p.logs = p.logs || [];
  p.logs.push({ id: ++nodeSeq, date, type: '', text });
  document.getElementById('log-text').value = '';
  saveProjects(); renderProjectDetail();
});

// 完成事项：勾选 → 进度联动 + 全部完成自动标记
document.getElementById('todoList').addEventListener('change', e => {
  const cb = e.target.closest('input[data-tid]'); if (!cb) return;
  const p = getProject(currentDetailId); const t = (p.todos||[]).find(x => x.id === Number(cb.dataset.tid));
  if (t) {
    t.done = cb.checked;
    const before = p.status;
    recalcProgress(p);
    if (before !== 'completed' && p.status === 'completed') alert(`🎉「${p.name}」所有事项已完成，已标记为已完成`);
    saveProjects(); renderAll(); renderProjectDetail();
  }
});

// 完成事项：编辑 / 删除
document.getElementById('todoList').addEventListener('click', e => {
  const p = getProject(currentDetailId); if (!p) return;
  const save = e.target.closest('[data-edsave="todo"]');
  if (save) { saveTodoEdit(p, save.dataset.id); return; }
  if (e.target.closest('[data-edcancel]')) { editingTodo = null; renderProjectDetail(); return; }
  const del = e.target.closest('[data-del="todo"]');
  if (del) { p.todos = (p.todos||[]).filter(x => x.id !== Number(del.dataset.id)); editingTodo = null; recalcProgress(p); saveProjects(); renderAll(); renderProjectDetail(); return; }
  const edit = e.target.closest('[data-edit="todo"]');
  if (edit) { editingTodo = Number(edit.dataset.id); renderProjectDetail(); return; }
});
function saveTodoEdit(p, id) {
  const t = (p.todos||[]).find(x => x.id === Number(id)); if (!t) return;
  const title = document.getElementById('ed-td-title').value.trim();
  const date = document.getElementById('ed-td-date').value;
  if (!title) { alert('请输入事项名称'); return; }
  t.title = title; t.date = date;
  editingTodo = null; saveProjects(); renderProjectDetail();
}

// 项目时间线：勾选 = 该节点完成 → 进度 / 日历 / 甘特 / 看板同步
document.getElementById('logList').addEventListener('change', e => {
  const cb = e.target.closest('input[data-lid]'); if (!cb) return;
  const p = getProject(currentDetailId); if (!p) return;
  const l = (p.logs || []).find(x => x.id === Number(cb.dataset.lid));
  if (!l) return;
  l.done = cb.checked;
  const before = p.status;
  recalcProgress(p);
  if (before !== 'completed' && p.status === 'completed') alert(`🎉「${p.name}」所有节点已完成，已标记为已完成`);
  saveProjects(); renderAll(); renderProjectDetail();
});

// 项目时间线：编辑 / 删除
document.getElementById('logList').addEventListener('click', e => {
  const p = getProject(currentDetailId); if (!p) return;
  const save = e.target.closest('[data-edsave="log"]');
  if (save) { saveLogEdit(p, save.dataset.id); return; }
  if (e.target.closest('[data-edcancel]')) { editingLog = null; renderProjectDetail(); return; }
  const del = e.target.closest('[data-del="log"]');
  if (del) { p.logs = (p.logs||[]).filter(x => x.id !== Number(del.dataset.id)); editingLog = null; saveProjects(); renderProjectDetail(); return; }
  const edit = e.target.closest('[data-edit="log"]');
  if (edit) { editingLog = Number(edit.dataset.id); renderProjectDetail(); return; }
});
function saveLogEdit(p, id) {
  const l = (p.logs||[]).find(x => x.id === Number(id)); if (!l) return;
  const text = document.getElementById('ed-lg-text').value.trim();
  const date = document.getElementById('ed-lg-date').value;
  if (!text) { alert('请输入记录内容'); return; }
  l.text = text; l.date = date;
  editingLog = null; saveProjects(); renderProjectDetail();
}

document.getElementById('td-add').addEventListener('click', () => {
  const p = getProject(currentDetailId); if (!p) return;
  const title = document.getElementById('td-title').value.trim();
  const date = document.getElementById('td-date').value;
  if (!title) { alert('请输入事项名称'); return; }
  if (!date) { alert('请选择日期'); return; }
  p.todos = p.todos || [];
  p.todos.push({ id: ++nodeSeq, date, title, done: false });
  document.getElementById('td-title').value = '';
  recalcProgress(p); saveProjects(); renderAll(); renderProjectDetail();
});
document.getElementById('detailNotes').addEventListener('change', e => { const p = getProject(currentDetailId); if (p) { p.notes = e.target.value; saveProjects(); } });
document.getElementById('detailPlans').addEventListener('change', e => { const p = getProject(currentDetailId); if (p) { p.plans = e.target.value; saveProjects(); } });

/* ============================================================
   ▍自动保存（退出 / 切后台时兜底落盘）
   ============================================================ */
function flushDetail() {
  if (!currentDetailId) return;
  const p = getProject(currentDetailId); if (!p) return;
  const n = document.getElementById('detailNotes');
  const pl = document.getElementById('detailPlans');
  if (n) p.notes = n.value;
  if (pl) p.plans = pl.value;
  saveProjects();
}
window.addEventListener('beforeunload', flushDetail);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushDetail(); });
</script>
</body>
</html>
